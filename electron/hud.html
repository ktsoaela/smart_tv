<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Smart TV panel</title>
  <style>
    :root { color-scheme: dark; }
    html, body, #root { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      color: #f5f7fb;
      font-size: min(5vw, 4.5vh);
    }
    .panel {
      box-sizing: border-box;
      height: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(18, 21, 29, 0.86);
      backdrop-filter: blur(24px);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .panel.on { opacity: 1; transform: none; }
    .hint {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 1.2em;
      border-radius: 999px;
      text-align: center;
    }
    .hint b { font-size: 34vh; font-weight: 800; letter-spacing: -0.02em; }
    .hint span { margin-top: 0.15em; font-size: 22vh; color: rgba(232, 238, 249, 0.75); }
    .volume {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3vh;
      padding: 5vh 0 4vh;
      border-radius: 999px;
    }
    .num { font-size: 32vw; font-weight: 800; font-variant-numeric: tabular-nums; }
    .track { position: relative; flex: 1; width: 9vw; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
    .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; transition: height 0.2s ease; }
    .label { font-size: 13vw; color: rgba(232, 238, 249, 0.7); }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .leave {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.7rem;
      padding: 1.3rem 1.5rem 1.4rem;
      border-radius: 1.4rem;
      text-align: center;
      font-size: 16px;
    }
    .leave b { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; }
    .leave p { margin: 0; color: rgba(232, 238, 249, 0.75); }
    .choices { display: flex; justify-content: center; gap: 0.7rem; margin-top: 0.35rem; }
    .choice {
      min-width: 8.5rem;
      padding: 0.75rem 1.1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      font-weight: 700;
    }
    .choice.on { background: #fff; color: #0b0d12; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    "use strict";
    const root = document.getElementById("root");
    window.show = (msg) => {
      const el = document.createElement("div");
      if (msg.kind === "volume") {
        const pct = Math.round((msg.level || 0) * 100);
        el.className = "panel volume";
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = msg.muted ? "Mute" : String(pct);
        const track = document.createElement("span");
        track.className = "track";
        const fill = document.createElement("span");
        fill.className = "fill";
        fill.style.height = `${msg.muted ? 0 : pct}%`;
        track.append(fill);
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "Volume";
        el.append(num, track, label);
      } else if (msg.kind === "leave") {
        el.className = "panel leave";
        const title = document.createElement("b");
        title.textContent = msg.title || "Leave this app?";
        const text = document.createElement("p");
        text.textContent = msg.text || "";
        const row = document.createElement("div");
        row.className = "choices";
        (msg.choices || []).forEach((label, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice" + (index === msg.selected ? " on" : "");
          button.textContent = label;
          button.addEventListener("click", () => {
            if (window.hudHost) window.hudHost.choose(index);
          });
          row.append(button);
        });
        el.append(title, text, row);
      } else {
        el.className = "panel hint";
        const title = document.createElement("b");
        title.textContent = msg.title || "";
        const text = document.createElement("span");
        text.textContent = msg.text || "";
        el.append(title, text);
      }
      root.replaceChildren(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
    };
  </script>
</body>
</html>
